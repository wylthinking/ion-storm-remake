name = "ion-storm"
main = "worker/index.ts"
compatibility_date = "2026-05-24"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[durable_objects.bindings]]
name = "ION_ACCOUNT_STATE"
class_name = "AccountState"

[[durable_objects.bindings]]
name = "ION_ROOM_STATE"
class_name = "RoomState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountState"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomState"]

[[kv_namespaces]]
binding = "ION_USERS"
id = "REPLACE_WITH_ION_USERS_KV_ID"

[[kv_namespaces]]
binding = "ION_ROOMS"
id = "REPLACE_WITH_ION_ROOMS_KV_ID"

[[kv_namespaces]]
binding = "ION_SESSIONS"
id = "REPLACE_WITH_ION_SESSIONS_KV_ID"



[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 0.01
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 0.01
